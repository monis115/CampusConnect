spring.application.name=CampusConnect

# ===================== DATABASE CONFIGURATION =====================
# Use environment variables in production, defaults for local development
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/campusConnect}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:Monis@333}
spring.jpa.hibernate.ddl-auto=update

# ===================== EMAIL CONFIGURATION =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:razaraza5051@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zxwq sohp zjnc kdjp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
admin.contact.email=${ADMIN_EMAIL:razaraza5051@gmail.com}

# ===================== AWS S3 CONFIGURATION =====================
# Set aws.s3.enabled=true in production to use S3 for file storage
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.bucket=${AWS_S3_BUCKET:campusconnect-uploads}
aws.region=${AWS_REGION:ap-south-1}

# ===================== APPLICATION URL =====================
# Base URL for generating links in emails, PDFs, etc.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===================== CORS CONFIGURATION =====================
# Comma-separated list of allowed origins (use specific domains in production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===================== FILE UPLOAD LIMITS =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===================== JSON SERIALIZATION =====================
spring.mvc.contentnegotiation.media-types.json=application/json
spring.http.converters.preferred-json-mapper=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ===================== JPA / HIBERNATE =====================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# SQL logging (disable in production for performance)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===================== SECURITY LOGGING =====================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}

# ===================== DAILY REPORT SCHEDULER =====================
report.email.recipient=${REPORT_EMAIL:razaraza5051@gmail.com}
report.scheduler.enabled=${REPORT_SCHEDULER_ENABLED:true}

# ===================== ACTUATOR (Health Checks) =====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
